name: Update lotto results

on:
  schedule:
    # 12:00 UTC daily - after OzLotto (Tue), Powerball (Thu) and TattsLotto
    # (Sat) draws and their dividends have been published in Australia.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-lotto-results
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scrape_lotto_results.py

      - name: Commit and push updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lotto_results/
          if git diff --cached --quiet; then
            echo "No new draws."
            exit 0
          fi
          git commit -m "Update lotto results $(date -u +%Y-%m-%d)"
          git push
